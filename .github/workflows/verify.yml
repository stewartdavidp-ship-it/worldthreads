name: Verify research intake and publication
on:
  pull_request:
  push:
    branches: [main, codex/tambora-local-threads]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python3 scripts/audit.py
